name: container-publish
description: >-
  Build a container image with Docker Buildx, scan it with Trivy (fails on fixable
  critical vulnerabilities) and keep a CycloneDX SBOM as artifact. Only a clean image is
  pushed: with push enabled it goes to GitHub Container Registry and is referenced by
  digest; without push it stays in the local Docker engine for testing.

inputs:
  app:
    description: Image name. Lowercase letters, digits and dashes.
    required: true
  context:
    description: Build context directory that contains the Dockerfile.
    required: false
    default: "."
  push:
    description: "'true' pushes to ghcr.io, 'false' loads the image locally."
    required: false
    default: "false"
  token:
    description: Token used to push to ghcr.io. Needs the packages write permission.
    required: false
    default: ${{ github.token }}
  scan-severity:
    description: Severities that fail the image scan (only vulnerabilities with a fix).
    required: false
    default: CRITICAL

outputs:
  image:
    description: >-
      Image reference. With push: ghcr.io/OWNER/APP@sha256:DIGEST.
      Without push: a local tag ghcr.io/OWNER/APP:sha-COMMIT.
    value: ${{ steps.result.outputs.image }}

runs:
  using: composite
  steps:
    - name: Resolve image name
      id: name
      shell: bash
      env:
        APP: ${{ inputs.app }}
        OWNER: ${{ github.repository_owner }}
        SHA: ${{ github.sha }}
      run: |
        if [[ ! "$APP" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
          echo "::error::Input 'app' must contain only lowercase letters, digits and dashes, got '$APP'."
          exit 1
        fi
        owner="${OWNER,,}"
        echo "repository=ghcr.io/${owner}/${APP}" >> "$GITHUB_OUTPUT"
        echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build image (local)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        push: false
        load: true
        tags: ${{ steps.name.outputs.repository }}:${{ steps.name.outputs.tag }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Scan image (Trivy gate)
      shell: bash
      env:
        IMAGE: ${{ steps.name.outputs.repository }}:${{ steps.name.outputs.tag }}
        SEVERITY: ${{ inputs.scan-severity }}
        TRIVY: aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 # 0.69.1
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
          --quiet --exit-code 1 --severity "$SEVERITY" --ignore-unfixed "$IMAGE"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
          --quiet --format cyclonedx "$IMAGE" > "$RUNNER_TEMP/sbom.cdx.json"

    - name: Keep the SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ inputs.app }}
        path: ${{ runner.temp }}/sbom.cdx.json

    - name: Push image (only after a clean scan)
      id: build
      if: inputs.push == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.name.outputs.repository }}:${{ steps.name.outputs.tag }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Set output
      id: result
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        REPOSITORY: ${{ steps.name.outputs.repository }}
        TAG: ${{ steps.name.outputs.tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        if [ "$PUSH" = "true" ]; then
          image="${REPOSITORY}@${DIGEST}"
        else
          image="${REPOSITORY}:${TAG}"
        fi
        echo "image=${image}" >> "$GITHUB_OUTPUT"
        echo "Image: ${image}"
