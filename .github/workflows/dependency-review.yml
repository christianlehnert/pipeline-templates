name: dependency-review

# Reusable workflow: fail a pull request that adds dependencies with known
# vulnerabilities at or above the given severity. Call it only for pull_request events.
# Free for public repositories. The calling job must grant: contents: read.

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Lowest severity that fails the check (low, moderate, high, critical).
        type: string
        required: false
        default: high

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
