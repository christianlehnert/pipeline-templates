name: secret-scan

# Reusable workflow: scans the whole git history of the calling repository for secrets
# with gitleaks. gitleaks is built from source, from a repository and commit you choose
# (for example your own fork), so no binary from the internet is trusted.
# The job fails when gitleaks finds a secret. Findings are redacted in the log and summary.
#
# Configuration lives in the calling repository:
#   .gitleaks.toml     own rules or allowlists (optional, picked up automatically)
#   .gitleaksignore    fingerprints of accepted findings (optional, one per line)
#
# The calling job must grant: contents: read.

on:
  workflow_call:
    inputs:
      gitleaks-repository:
        description: Repository to build gitleaks from (owner/name).
        type: string
        required: false
        default: gitleaks/gitleaks
      gitleaks-ref:
        description: Full 40-character commit SHA of gitleaks to build (default is v8.30.1).
        type: string
        required: false
        default: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
      runs-on:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the gitleaks ref
        env:
          REF: ${{ inputs.gitleaks-ref }}
        run: |
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gitleaks-ref must be a full 40-character commit SHA, got '$REF'"
            exit 1
          fi

      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Restore gitleaks binary
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-bin
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gitleaks-repository }}-${{ inputs.gitleaks-ref }}

      - name: Check out gitleaks source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitleaks-repository }}
          ref: ${{ inputs.gitleaks-ref }}
          path: gitleaks-src
          persist-credentials: false

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gitleaks-src/go.mod
          cache-dependency-path: gitleaks-src/go.sum

      - name: Build gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: gitleaks-src
        env:
          REF: ${{ inputs.gitleaks-ref }}
          OUT: ${{ runner.temp }}/gitleaks-bin
        run: |
          mkdir -p "$OUT"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X=github.com/zricethezav/gitleaks/v8/version.Version=${REF:0:12}" \
            -o "$OUT/gitleaks" .

      - name: Scan history
        env:
          BIN: ${{ runner.temp }}/gitleaks-bin/gitleaks
          REPORT: ${{ runner.temp }}/gitleaks-report.json
          SOURCE: ${{ inputs.gitleaks-repository }}@${{ inputs.gitleaks-ref }}
        run: |
          set +e
          "$BIN" git --redact --no-banner --verbose \
            --report-format json --report-path "$REPORT" src
          rc=$?
          set -e
          count=$(jq length "$REPORT" 2>/dev/null || echo "?")
          {
            echo "### gitleaks"
            echo "Built from \`$SOURCE\`."
            if [ "$rc" -eq 0 ]; then
              echo "No secrets found in the history."
            else
              echo "**$count finding(s).** Secret values are redacted."
              echo
              echo "| Rule | File | Line | Commit | Fingerprint |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) | `\(.Fingerprint)` |"' "$REPORT" 2>/dev/null
              echo
              echo "Real secret: revoke it first, then remove it. False positive: add the fingerprint to \`.gitleaksignore\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
