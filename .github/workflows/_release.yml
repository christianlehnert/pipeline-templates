name: release

# When a version tag such as v1.2.3 is pushed, move the major tag (v1) to the same
# commit. Applications that reference @v1 then receive the release automatically.
# Breaking changes get a new major version (v2) instead.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  move-major-tag:
    name: Move major version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move major tag to this release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # No checkout and no persisted git credentials: the tag is moved through the API.
          major="${TAG%%.*}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${major}" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "Moved ${major} to ${TAG} (${GITHUB_SHA})."
