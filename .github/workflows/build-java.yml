name: build-java

# Reusable workflow: build and test a Maven project, build the container image,
# smoke-test it and optionally push it to GitHub Container Registry.
# The calling job must grant: contents: read, packages: write.

on:
  workflow_call:
    inputs:
      app:
        description: Image name. Lowercase letters, digits and dashes.
        type: string
        required: true
      java-version:
        description: Java version for actions/setup-java.
        type: string
        required: false
        default: "21"
      working-directory:
        description: Directory that contains pom.xml and Dockerfile.
        type: string
        required: false
        default: "."
      push:
        description: Push the image to ghcr.io. Set to true on the main branch only.
        type: boolean
        required: false
        default: false
      port:
        description: Port the application listens on inside the container.
        type: string
        required: false
        default: "8080"
      health-path:
        description: Health endpoint used for the smoke test.
        type: string
        required: false
        default: /health
    outputs:
      image:
        description: Image reference. With push it is ghcr.io/OWNER/APP@sha256:DIGEST.
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build container image
        id: publish
        uses: christianlehnert/pipeline-templates/actions/container-publish@v1
        with:
          app: ${{ inputs.app }}
          context: ${{ inputs.working-directory }}
          push: ${{ inputs.push }}

      - name: Smoke test
        uses: christianlehnert/pipeline-templates/actions/smoke-test@v1
        with:
          image: ${{ steps.publish.outputs.image }}
          port: ${{ inputs.port }}
          path: ${{ inputs.health-path }}
